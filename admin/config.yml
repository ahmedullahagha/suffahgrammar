backend:
  name: git-gateway
  branch: main
  identity_url: https://superlative-muffin-b0fa4d.netlify.app/.netlify/identity
  gateway_url: https://superlative-muffin-b0fa4d.netlify.app/.netlify/git

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://www.suffahgrammar.com
display_url: https://www.suffahgrammar.com
logo_url: https://www.suffahgrammar.com/assets/crest.webp

collections:

  # ── BLOG POSTS ──
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog.html"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The headline of your post" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Ahmed Ullah Agha" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "School News", value: "news" }
          - { label: "Academic Update", value: "academic" }
          - { label: "Events", value: "events" }
          - { label: "Community", value: "community" }
          - { label: "Admissions", value: "admissions" }
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Main image shown at the top of the post" }
      - { label: "Image Caption", name: "image_caption", widget: "string", required: false }
      - { label: "Summary", name: "summary", widget: "text", hint: "Short description shown in previews (2-3 sentences)" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  # ── NEWSLETTERS ──
  - name: "newsletter"
    label: "Newsletters"
    label_singular: "Newsletter"
    folder: "_newsletters"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Subject Line", name: "title", widget: "string" }
      - { label: "Issue Number", name: "issue", widget: "string", hint: "e.g. Issue 1 — Spring term" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Introduction", name: "intro", widget: "text", hint: "Opening paragraph" }
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Sections"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Section Title", name: "heading", widget: "string" }
          - { label: "Content", name: "content", widget: "markdown" }
          - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  # ── IMAGE GALLERIES ──
  - name: "gallery"
    label: "Photo Galleries"
    label_singular: "Gallery"
    folder: "_galleries"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Gallery Title", name: "title", widget: "string", hint: "e.g. Annual Day" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Events", value: "events" }
          - { label: "Classroom Life", value: "classroom" }
          - { label: "Trips & Excursions", value: "trips" }
          - { label: "Achievements", value: "achievements" }
          - { label: "Campus", value: "campus" }
      - label: "Photos"
        name: "photos"
        widget: "list"
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  # ── ANNOUNCEMENTS (short notices) ──
  - name: "announcements"
    label: "Announcements"
    label_singular: "Announcement"
    folder: "_announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "General Notice", value: "notice" }
          - { label: "Holiday", value: "holiday" }
          - { label: "Exam Schedule", value: "exam" }
          - { label: "Event", value: "event" }
          - { label: "Admissions", value: "admissions" }
      - { label: "Message", name: "body", widget: "markdown" }
      - { label: "Important?", name: "important", widget: "boolean", default: false, hint: "Highlights a recent notice. Notices older than 90 days are shown as archived." }
      - { label: "Published", name: "published", widget: "boolean", default: true }

